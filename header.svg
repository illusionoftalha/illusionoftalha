<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Talha - Full Stack Engineer. C, Java, WordPress." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="clip"><rect width="900" height="240" rx="16"/></clipPath>
    <style>
      .name{font:800 76px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#000;letter-spacing:4px}
      .dot{fill:#7a7a7a}
      .role{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#222;letter-spacing:3px}
      .tag{font:700 20px 'Consolas','Courier New',monospace;fill:#000;opacity:0}
      .t1{animation:s 8s infinite 0s}
      .t2{animation:s 8s infinite 2s}
      .t3{animation:s 8s infinite 4s}
      .t4{animation:s 8s infinite 6s}
      @keyframes s{0%{opacity:0;transform:translateY(6px)}6%,22%{opacity:1;transform:translateY(0)}28%,100%{opacity:0}}
      .orb{animation:f 6s ease-in-out infinite alternate}
      @keyframes f{from{transform:translateY(0)}to{transform:translateY(-14px)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <g class="orb"><circle cx="790" cy="70" r="90" fill="#000" opacity="0.07"/></g>
    <g class="orb" style="animation-delay:-3s"><circle cx="840" cy="190" r="60" fill="#000" opacity="0.14"/></g>
    <rect width="900" height="240" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
  </g>
  <rect x="48" y="40" width="6" height="150" rx="3" fill="#000"/>
  <text x="74" y="108" class="name">TALHA<tspan class="dot">.</tspan></text>
  <text x="76" y="148" class="role">FULL STACK ENGINEER</text>
  <text x="76" y="188" class="tag t1">&gt; building in C</text>
  <text x="76" y="188" class="tag t2">&gt; writing Java + Swing</text>
  <text x="76" y="188" class="tag t3">&gt; shipping WordPress</text>
  <text x="76" y="188" class="tag t4">&gt; crafting for the web</text>
</svg>
