<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Talha - Full Stack Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#070707"/></linearGradient><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <style>
      .name{font:800 76px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#f2f2f2;letter-spacing:4px}
      .dot{fill:#6b6b6b}
      .role{font:700 20px 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#9a9a9a;letter-spacing:5px}
      .tag{font:700 19px 'SF Mono','Consolas','Menlo','Courier New',monospace;fill:#d9d9d9;opacity:0}
      .t1{animation:s 8s infinite 0s}.t2{animation:s 8s infinite 2s}.t3{animation:s 8s infinite 4s}.t4{animation:s 8s infinite 6s}
      @keyframes s{0%{opacity:0;transform:translateY(6px)}6%,22%{opacity:1;transform:translateY(0)}28%,100%{opacity:0}}
      .orb{animation:f 7s ease-in-out infinite alternate}
      @keyframes f{from{transform:translateY(0)}to{transform:translateY(-12px)}}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="238" rx="16" fill="url(#m)" stroke="#2c2c2c" stroke-width="1.5"/><rect x="1" y="1" width="898" height="238" rx="16" filter="url(#g)" opacity="0.07"/>
  <g class="orb"><circle cx="790" cy="80" r="86" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1.5"/></g>
  <g class="orb" style="animation-delay:-3.5s"><circle cx="835" cy="180" r="54" fill="#fff" fill-opacity="0.035"/></g>
  <rect x="48" y="40" width="5" height="150" rx="2.5" fill="#f2f2f2"/>
  <text x="74" y="108" class="name">TALHA<tspan class="dot">.</tspan></text>
  <text x="76" y="148" class="role">FULL STACK ENGINEER</text>
  <text x="76" y="188" class="tag t1">&gt; building in C</text>
  <text x="76" y="188" class="tag t2">&gt; writing Java + Swing</text>
  <text x="76" y="188" class="tag t3">&gt; shipping WordPress</text>
  <text x="76" y="188" class="tag t4">&gt; crafting for the web</text>
</svg>